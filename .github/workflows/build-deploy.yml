name: Build and deploy reader

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Queue runs instead of cancelling them: a run cancelled mid-deploy leaves a
# Pages deployment behind that makes the next deploy fail. Only the newest
# pending run is kept, so the queue never grows past one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/build.js

      - name: Preparar site estático
        run: |
          mkdir -p dist
          cp index.html style.css app.js reader.json first-seen.json dist/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # deploy-pages occasionally fails with a transient GitHub Pages API
      # error, so try once more after a pause. Keep this to official actions:
      # this step can publish the site. (A third-party retry wrapper, pinned
      # to a moving @v3 tag, ran its own copy of deploy-pages and on
      # 2026-11-12 reported deploys as successful while the site stayed
      # frozen.)
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Aguardar antes de tentar de novo
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
