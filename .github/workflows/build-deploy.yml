name: Build and deploy reader

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Queue runs instead of cancelling them: a run cancelled mid-deploy leaves a
# Pages deployment behind that makes the next deploy fail. Only the newest
# pending run is kept, so the queue never grows past one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/build.js

      - name: Preparar site estático
        run: |
          mkdir -p dist
          cp index.html style.css app.js reader.json first-seen.json dist/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # deploy-pages occasionally fails with a transient GitHub Pages API
      # error; retry a few times before giving up.
      - id: deployment
        uses: Wandalen/wretry.action@v3
        with:
          action: actions/deploy-pages@v4
          attempt_limit: 3
          attempt_delay: 15000
