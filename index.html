<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reader</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('reader:theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch (err) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-row">
      <h1 class="site-title">Reader</h1>
      <div class="site-header-actions">
        <a
          class="feeds-link"
          href="https://github.com/denispacheco-prog/reader/edit/main/feeds.opml"
          target="_blank"
          rel="noopener noreferrer"
          title="gerenciar feeds no GitHub"
        >gerenciar feeds</a>
        <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="alternar tema"></button>
      </div>
    </div>
    <input
      id="search"
      class="search-input"
      type="search"
      placeholder="buscar no que já foi lido..."
      autocomplete="off"
    />
  </header>

  <main id="stream" aria-live="polite">
    <p class="loading">carregando...</p>
  </main>

  <p id="ambient-closure" class="ambient-closure">
    você está em dia.
  </p>

  <script type="module" src="app.js"></script>
</body>
</html>
